<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 190" role="img" aria-label="Toucan">
  <defs>
    <linearGradient id="beak" x1="0.05" y1="0.5" x2="1" y2="0.42">
      <stop offset="0" stop-color="#1f9d57"/>
      <stop offset="0.30" stop-color="#7fc241"/>
      <stop offset="0.52" stop-color="#f2b134"/>
      <stop offset="0.76" stop-color="#e8842b"/>
      <stop offset="1" stop-color="#d8392a"/>
    </linearGradient>
  </defs>

  <!-- festive yellow blob backdrop -->
  <path d="M104 6
           C160 2 214 34 220 92
           C225 142 188 184 122 187
           C58 190 10 156 7 100
           C4 50 48 10 104 6 Z" fill="#f2b134"/>

  <!-- bird body + head (one black silhouette, facing right) -->
  <path d="M86 44
           C66 46 54 64 54 88
           C54 104 60 116 60 128
           C60 152 76 168 100 168
           C126 168 142 150 142 124
           C142 110 136 102 130 96
           C124 90 120 86 118 80
           C115 70 110 60 104 54
           C99 49 93 43 86 44 Z" fill="#181818"/>

  <!-- yellow throat / bib -->
  <path d="M112 96
           C120 104 124 116 121 128
           C118 142 104 150 92 146
           C100 144 108 136 109 124
           C110 112 108 102 104 96 Z" fill="#f7d24a"/>

  <!-- upper beak (big keel bill) -->
  <path d="M112 74
           C140 66 178 66 212 82
           C214 83 214 86 211 87
           C176 95 140 99 116 96
           C110 95 107 88 108 82
           C109 78 110 75 112 74 Z" fill="url(#beak)"/>

  <!-- lower beak -->
  <path d="M116 96
           C150 99 182 95 209 88
           C200 104 176 114 150 114
           C134 114 122 108 116 99 Z" fill="url(#beak)" opacity="0.92"/>

  <!-- mouth line -->
  <path d="M114 90 C150 94 182 92 210 85" stroke="#181818" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.55"/>
  <!-- beak base accent -->
  <path d="M111 73 C113 84 113 90 116 98" stroke="#0c7a3f" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- eye patch -->
  <ellipse cx="96" cy="70" rx="20" ry="16" fill="#bfe25a"/>
  <!-- eye -->
  <circle cx="100" cy="70" r="7" fill="#181818"/>
  <circle cx="102.4" cy="67.6" r="2.1" fill="#fff"/>
</svg>
