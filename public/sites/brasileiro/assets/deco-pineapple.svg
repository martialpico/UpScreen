<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 185" role="img" aria-label="Pineapple">
  <style>
    #leaves { transform-origin: 65px 78px; animation: sway 4.2s ease-in-out infinite; }
    #leaf-a { animation: sway2 3.4s ease-in-out infinite; transform-origin: 65px 80px; }
    @keyframes sway  { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
    @keyframes sway2 { 0%,100% { transform: rotate(2.5deg); } 50% { transform: rotate(-2.5deg); } }
  </style>

  <!-- body -->
  <ellipse cx="65" cy="122" rx="40" ry="48" fill="#f2b134"/>
  <ellipse cx="65" cy="122" rx="40" ry="48" fill="none" stroke="#e08a2b" stroke-width="2" opacity="0.5"/>
  <!-- crosshatch -->
  <g stroke="#cf7a25" stroke-width="2.4" opacity="0.55" stroke-linecap="round">
    <path d="M34 96 L96 150 M34 122 L90 168 M40 88 L100 134 M30 110 L84 156 M48 84 L102 124"/>
    <path d="M96 96 L34 150 M96 122 L40 168 M90 88 L30 134 M100 110 L46 156 M82 84 L28 124"/>
  </g>
  <!-- studs -->
  <g fill="#8a4f17" opacity="0.5">
    <circle cx="52" cy="108" r="2.4"/><circle cx="72" cy="112" r="2.4"/><circle cx="62" cy="128" r="2.4"/>
    <circle cx="44" cy="132" r="2.4"/><circle cx="82" cy="136" r="2.4"/><circle cx="60" cy="150" r="2.4"/>
  </g>

  <!-- crown -->
  <g id="leaves">
    <path d="M65 84 C58 56 52 36 40 18 C58 28 64 52 67 78 Z" fill="#0c7a3f"/>
    <path d="M65 84 C72 56 78 36 90 18 C72 28 66 52 63 78 Z" fill="#0c7a3f"/>
    <path id="leaf-a" d="M65 86 C60 54 58 28 65 6 C72 28 70 54 65 86 Z" fill="#1f9d57"/>
    <path d="M65 84 C52 62 40 50 26 44 C44 46 60 60 67 80 Z" fill="#2faf57"/>
    <path d="M65 84 C78 62 90 50 104 44 C86 46 70 60 63 80 Z" fill="#2faf57"/>
  </g>
</svg>
